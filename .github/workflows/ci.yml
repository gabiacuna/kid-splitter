name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install backend dependencies & run unit tests
        working-directory: backend
        env:
          # app.db reads this at import time; the tests never open a connection.
          DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/ci
        run: |
          uv sync --frozen
          uv run pytest

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck & build frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx tsc --noEmit -p e2e/tsconfig.json
          npm run build

  deploy:
    name: deploy
    # Only after a merge to main, and only if the checks above passed.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # Workload Identity Federation (no long-lived JSON key)
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # deploy.sh checks the Secret Manager secrets, then runs `gcloud run deploy --source .`
      # (Cloud Build uses the Dockerfile). Defaults: project kid-splitter-prod, us-central1.
      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: ./deploy.sh --quiet
