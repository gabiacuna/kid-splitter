name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install backend dependencies & run unit tests
        working-directory: backend
        run: |
          uv sync --frozen --no-dev
          uv run python tests/test_supabase_auth.py
          uv run python tests/test_account_export.py
          uv run python tests/test_export.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck & build frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx tsc --noEmit -p e2e/tsconfig.json
          npm run build
